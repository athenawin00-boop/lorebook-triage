<div class="jev-lorebook-panel">
    <div class="jev-panel-header">
        <h3>Jev Lorebook — 세부</h3>
        <div id="jev_panel_refresh" class="menu_button menu_button_icon" title="패널을 새로고침해요">
            <i class="fa-solid fa-rotate"></i>
            <span>새로고침</span>
        </div>
    </div>

    <div class="jev-panel-section">
        <div class="jev-panel-title">상태</div>
        <div id="jev_panel_summary"></div>
    </div>

    <div class="jev-panel-section">
        <div class="jev-panel-title">챗 → 로어북 변환</div>
        <div class="jev-panel-muted">마지막 변환 지점 이후의 메시지만 요약해서 대상 로어북에 날짜별 항목으로 추가하고, 자동으로 색인까지 해 드려요.</div>
        <div id="jev_panel_convert_profile" class="jev-profile-badge"></div>
        <div class="flex-container">
            <div id="jev_panel_convert" class="menu_button menu_button_icon" title="새 메시지를 요약해 로어북 항목으로 변환하고 자동으로 색인해요">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>챗 → 로어북 변환</span>
            </div>
            <div id="jev_panel_reindex" class="menu_button menu_button_icon" title="대상 로어북 전체를 다시 색인해요 (초기화 후 재삽입)">
                <i class="fa-solid fa-database"></i>
                <span>재색인</span>
            </div>
            <div id="jev_panel_split" class="menu_button menu_button_icon" title="통짜 항목을 날짜별 덩어리로 나눠 드려요 (실행 전에 자동 백업해요)">
                <i class="fa-solid fa-scissors"></i>
                <span>기존 항목 스플릿</span>
            </div>
            <div id="jev_panel_open_editor" class="menu_button menu_button_icon" title="대상 로어북을 에디터에서 바로 열어 드려요 — 백업본·비슷한 이름과 헷갈리지 않게요">
                <i class="fa-solid fa-book-open"></i>
                <span>이 로어북을 에디터에서 열기</span>
            </div>
        </div>
        <small id="jev_panel_convert_status" class="jev-lorebook-status"></small>
    </div>

    <div class="jev-panel-section">
        <div class="jev-panel-title">직전 턴 판정</div>
        <div id="jev_panel_judgment"></div>
    </div>

    <div class="jev-panel-section">
        <div class="jev-panel-title">색인 현황</div>
        <div id="jev_panel_chunks"></div>
    </div>
</div>
