<div class="jev-lorebook-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Jev Lorebook</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="jev-set-body">

            <div class="jev-set-group">기본</div>

            <label class="checkbox_label" for="jev_lorebook_enabled">
                <input id="jev_lorebook_enabled" type="checkbox" />
                <span>켜기</span>
            </label>

            <label for="jev_lorebook_api_key">Jev API 키 (TypeSafe)</label>
            <input id="jev_lorebook_api_key" class="text_pole" type="password" autocomplete="off" placeholder="Jev API 키가 필요해요. 키가 없으면 동작하지 않아요" />

            <div class="jev-set-group">검색 색인</div>

            <label for="jev_lorebook_embed_source">임베딩 소스</label>
            <select id="jev_lorebook_embed_source" class="text_pole"></select>
            <small id="jev_lorebook_key_status" class="jev-lorebook-status"></small>
            <div id="jev_lorebook_key_help" class="jev-key-help" style="display: none;"></div>
            <small class="jev-lorebook-status">Gemini(Google AI Studio)를 추천해요 — 무료 등급으로 충분해요.</small>

            <div id="jev_lorebook_embed_key_mode_row" class="jev-key-mode-row" style="display: none;">
                <label class="radio_label">
                    <input type="radio" name="jev_lorebook_embed_key_mode" id="jev_lorebook_embed_key_mode_shared" value="shared" />
                    <span>ST 저장 키 사용 (기존, 기본값)</span>
                </label>
                <label class="radio_label">
                    <input type="radio" name="jev_lorebook_embed_key_mode" id="jev_lorebook_embed_key_mode_dedicated" value="dedicated" />
                    <span>전용 키 직접 입력</span>
                </label>
            </div>
            <div id="jev_lorebook_embed_dedicated_key_row" style="display: none;">
                <label for="jev_lorebook_embed_dedicated_key">전용 임베딩 키 (Google AI Studio)</label>
                <input id="jev_lorebook_embed_dedicated_key" class="text_pole" type="password" autocomplete="off" placeholder="AIza..." />
                <small class="jev-key-help-punch">⚠ 이 키는 SillyTavern 금고가 아니라 이 확장 설정에 평문으로 저장돼요.</small>
            </div>
            <small id="jev_lorebook_embed_key_mode_unsupported" class="jev-lorebook-status" style="display: none;">이 소스는 ST 저장 키만 지원해요.</small>

            <label for="jev_lorebook_embed_model">임베딩 모델</label>
            <input id="jev_lorebook_embed_model" class="text_pole" type="text" autocomplete="off" />
            <small class="jev-set-help">비우면 기본 모델. 바꾸면 [색인] 다시.</small>
            <small id="jev_lorebook_reindex_warning" class="jev-reindex-warning" style="display: none;">⚠ 임베딩 설정이 바뀌어 재색인이 필요해요 — [색인]을 눌러 주세요.</small>

            <div id="jev_lorebook_index" class="menu_button menu_button_icon" title="대상 로어북(자동 감지 또는 고정)의 활성 항목을 벡터로 색인해요">
                <i class="fa-solid fa-database"></i>
                <span>색인</span>
            </div>
            <small class="jev-set-help">첫 설치 시 로어북을 연결한 뒤 눌러 주세요.</small>

            <small id="jev_lorebook_status" class="jev-lorebook-status"></small>

            <div class="jev-set-group">감지된 로어북</div>

            <small id="jev_lorebook_detect_summary" class="jev-detect-summary">확인 중…</small>

            <div class="jev-set-group">세부 설정</div>

            <div class="jev-set-buttons">
                <div id="jev_lorebook_open_injection" class="menu_button menu_button_icon" title="주입 예산·랜덤·회수 후보 수·대상 층·로어북별 설정을 여기서 조정해요">
                    <i class="fa-solid fa-sliders"></i>
                    <span>주입 세부 설정</span>
                </div>
                <div id="jev_lorebook_open_convert" class="menu_button menu_button_icon" title="챗 → 로어북 변환에 쓰는 모델·분량·문체를 여기서 조정해요">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>로어북 만들기 설정</span>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>
