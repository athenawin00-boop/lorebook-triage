<div class="jev-lorebook-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Jev Lorebook</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="jev_lorebook_enabled">
                <input id="jev_lorebook_enabled" type="checkbox" />
                <span>켜기</span>
            </label>

            <label for="jev_lorebook_api_key">Jev API 키 (TypeSafe)</label>
            <input id="jev_lorebook_api_key" class="text_pole" type="password" autocomplete="off" placeholder="Jev API 키가 필요해요. 키가 없으면 동작하지 않아요" />

            <label for="jev_lorebook_budget">턴당 주입 예산 (토큰)</label>
            <input id="jev_lorebook_budget" class="text_pole" type="number" min="500" max="20000" step="100" />

            <label for="jev_lorebook_keep_recent">변환 시 최근 메시지 보존 <small>(변환·숨김 제외, 기본 20)</small></label>
            <input id="jev_lorebook_keep_recent" class="text_pole" type="number" min="0" max="200" step="1" />

            <label for="jev_lorebook_embed_source">임베딩 소스 <small>(검색용 벡터 생성)</small></label>
            <select id="jev_lorebook_embed_source" class="text_pole"></select>
            <small id="jev_lorebook_key_status" class="jev-lorebook-status"></small>
            <small class="jev-lorebook-status">Gemini(Google AI Studio)를 추천해요 — 무료 등급으로 충분해요.</small>

            <label for="jev_lorebook_embed_model">임베딩 모델</label>
            <input id="jev_lorebook_embed_model" class="text_pole" type="text" autocomplete="off" />
            <small id="jev_lorebook_reindex_warning" class="jev-reindex-warning" style="display: none;">⚠ 임베딩 설정이 바뀌어 재색인이 필요해요 — [색인]을 눌러 주세요.</small>

            <div id="jev_lorebook_profile_row" class="jev-profile-row">
                <label for="jev_lorebook_convert_profile">변환에 사용할 연결 프로필 <small>(챗 → 로어북 변환 전용)</small></label>
                <select id="jev_lorebook_convert_profile" class="text_pole"></select>
            </div>

            <label for="jev_lorebook_world">대상 로어북 <small>(기본: 이 채팅/캐릭터에 연결된 로어북 자동 감지)</small></label>
            <select id="jev_lorebook_world" class="text_pole">
                <option value="">— 선택해 주세요 —</option>
            </select>

            <div id="jev_lorebook_index" class="menu_button menu_button_icon" title="대상 로어북(자동 감지 또는 고정)의 활성 항목을 벡터로 색인해요 (Gemini 임베딩)">
                <i class="fa-solid fa-database"></i>
                <span>색인</span>
            </div>

            <small id="jev_lorebook_status" class="jev-lorebook-status"></small>
        </div>
    </div>
</div>
